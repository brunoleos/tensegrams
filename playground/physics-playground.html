<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tensegrams — Physics Sandbox</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1b212b; --line:#2a313c;
    --fg:#d6deeb; --mut:#8a97a8; --acc:#5ccfe6; --acc2:#ffcb6b; --bad:#ff6b6b; --ok:#9ece6a;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:13px}
  #app{display:grid;grid-template-columns:260px 1fr;height:100vh}
  #app.nosidebar{grid-template-columns:0 1fr} /* menu de experimentos recolhido */
  /* sidebar */
  #sidebar{background:var(--panel);border-right:1px solid var(--line);overflow:hidden auto}
  #app.nosidebar #sidebar{border-right:none}
  #sidebar h1{font-size:13px;letter-spacing:.04em;margin:0;padding:14px 14px 6px;color:var(--acc)}
  #sidebar .sub{padding:0 14px 10px;color:var(--mut);font-size:11px;border-bottom:1px solid var(--line)}
  .grp{padding:10px 14px 2px;color:var(--acc2);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
  .item{padding:6px 14px;cursor:pointer;color:var(--fg);border-left:3px solid transparent;line-height:1.25}
  .item small{display:block;color:var(--mut);font-size:10.5px}
  .item:hover{background:var(--panel2)}
  .item.active{background:var(--panel2);border-left-color:var(--acc)}
  .badge{display:inline-block;font-size:9px;letter-spacing:.05em;text-transform:uppercase;
    border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px}
  .badge.decisivo{background:#3d2733;color:#ff8fa3;border:1px solid #6e3a4d}
  .badge.aberto{background:#2c3a2b;color:#9ece6a;border:1px solid #46603f}
  .badge.decidido{background:#26313e;color:#7a8aa0;border:1px solid #3a4a5e}
  .badge.adotado{background:#1f3a33;color:#5ccfa0;border:1px solid #2f5d4e}
  .badge.rejeitado{background:#3a2426;color:#ff6b6b;border:1px solid #5d3134}
  #notes{width:100%;min-height:60px;background:var(--panel2);color:var(--fg);
    border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;
    font-family:inherit;resize:vertical}
  /* main */
  main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
  header.sc{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
  header.sc .hbody{min-width:0}
  header.sc h2{margin:0 0 4px;font-size:15px}
  header.sc p{margin:0;color:var(--mut);max-width:80ch;line-height:1.45}
  /* botões de recolher/expandir os frames auxiliares (menu e parâmetros) */
  .framebtn{flex:0 0 auto;background:var(--panel2);color:var(--mut);border:1px solid var(--line);
    border-radius:5px;padding:4px 8px;font-size:13px;line-height:1;cursor:pointer}
  .framebtn:hover{color:var(--acc);border-color:var(--acc)}
  #controlsReopen{flex:0 0 auto;display:none;justify-content:center;
    background:var(--panel);border-top:1px solid var(--line);padding:5px}
  #app.nocontrols #controlsReopen{display:flex}
  #app.nocontrols #controls,#app.nocontrols #splitter{display:none} /* parâmetros recolhidos */
  .tabbar .collapsebtn{margin-left:auto;align-self:center;color:var(--mut);
    background:none;border:none;font-size:14px;padding:4px 8px;cursor:pointer}
  .tabbar .collapsebtn:hover{color:var(--acc)}
  #stage{position:relative;flex:1;min-height:0;background:
    radial-gradient(circle at 50% 50%, #131922 0%, #0c0f14 100%)}
  canvas{display:block;position:absolute;inset:0}
  #hud{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:11px;
    color:var(--mut);background:rgba(0,0,0,.45);padding:6px 9px;border-radius:6px;
    border:1px solid var(--line);white-space:pre;pointer-events:none}
  #hint{position:absolute;bottom:10px;left:10px;font-size:11px;color:var(--mut);
    background:rgba(0,0,0,.4);padding:5px 9px;border-radius:6px;pointer-events:none}
  /* toggles de visibilidade dos painéis sobrepostos ao canvas */
  #stagetoggles{position:absolute;bottom:10px;right:10px;display:flex;gap:5px;z-index:2}
  #stagetoggles button{font-size:10.5px;padding:3px 8px;border-radius:5px;
    background:rgba(0,0,0,.45);color:var(--mut);border:1px solid var(--line);line-height:1.2}
  #stagetoggles button:hover{color:var(--fg);border-color:var(--acc)}
  #stagetoggles button.on{color:var(--acc);border-color:var(--acc);background:rgba(92,207,230,.12)}
  /* splitter (redimensiona o painel de controles) */
  #splitter{height:7px;flex:0 0 auto;background:var(--line);cursor:ns-resize}
  #splitter:hover{background:var(--acc)}
  /* controls */
  #controls{flex:0 0 auto;height:210px;background:var(--panel);
    display:flex;flex-direction:column;overflow:hidden}
  .tabbar{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .tabbar button{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;
    padding:8px 13px;color:var(--mut);font-size:12px}
  .tabbar button:hover{color:var(--fg)}
  .tabbar button.active{color:var(--acc);border-bottom-color:var(--acc)}
  .tabpane{flex:1;overflow-y:auto;padding:10px 16px}
  .row{display:grid;grid-template-columns:160px 1fr 56px;gap:10px;align-items:center;margin-bottom:7px}
  .row label{color:var(--mut)}
  .row input[type=range]{width:100%}
  .row .val{font-family:var(--mono);color:var(--acc);text-align:right;font-size:11px}
  .row select,.row input[type=text]{background:var(--panel2);color:var(--fg);
    border:1px solid var(--line);border-radius:5px;padding:3px 6px;font-size:12px}
  .toggles{display:flex;flex-wrap:wrap;gap:8px 14px;margin:8px 0 6px}
  .toggles label{color:var(--mut);display:flex;gap:5px;align-items:center;cursor:pointer}
  .barrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
  button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:6px;padding:5px 11px;cursor:pointer;font-size:12px}
  button:hover{border-color:var(--acc)}
  button.primary{border-color:var(--acc);color:var(--acc)}
  .presets b{color:var(--mut);margin-right:4px;font-weight:500}
  /* prompt */
  #promptbox{border-top:1px solid var(--line);background:var(--panel2);padding:10px 16px;
    display:flex;gap:10px;align-items:flex-start}
  #prompt{flex:1;margin:0;font-family:var(--mono);font-size:11.5px;color:var(--fg);
    white-space:pre-wrap;line-height:1.4;max-height:120px;overflow:auto}
  #copy{white-space:nowrap}
  .sec{color:var(--acc2);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin:10px 0 4px}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <h1>TENSEGRAMS · PHYSICS SANDBOX</h1>
    <div class="sub">Explorador interativo das decisões de modelo físico. Arraste os corpos/alças para gerar forças.</div>
    <div id="menu"></div>
  </aside>
  <main>
    <header class="sc">
      <button id="toggleSidebar" class="framebtn" title="recolher/expandir o menu de experimentos">☰</button>
      <div class="hbody"><h2 id="scTitle"></h2><p id="scDesc"></p></div>
    </header>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="hud"></div>
      <div id="hint">arraste corpos para empurrar · arraste alças ◆ para mover atratores · botão Reset reinicia</div>
      <div id="stagetoggles">
        <button data-panel="hud" title="esconder/mostrar HUD de métricas">HUD</button>
        <button data-panel="spark" title="esconder/mostrar gráficos (sparklines)">gráficos</button>
        <button data-panel="hint" title="esconder/mostrar dica de uso">dicas</button>
      </div>
    </div>
    <div id="splitter" title="arraste para redimensionar o painel"></div>
    <div id="controlsReopen"><button class="framebtn" id="reopenControls" title="expandir o painel de parâmetros">▴ parâmetros do live</button></div>
    <div id="controls"></div>
    <div id="promptbox">
      <pre id="prompt"></pre>
      <button id="copy" class="primary">Copiar</button>
    </div>
  </main>
</div>
<script>
"use strict";
/* ============================================================
   ENGINE — partículas, integrador, biblioteca de forças/constraints
   ============================================================ */
function world(){ return {bodies:[], handles:[], alpha:1, acc:new Map(), step:0,
  contacts:[], chains:[], attractors:[], stats:{}}; }
function addBody(w,o){ const b=Object.assign(
  {x:0,y:0,vx:0,vy:0,fx:0,fy:0,im:1,r:14,cl:null,cw:null,color:'#6cf',fixed:false,role:'body'},o);
  if(b.hw!=null){ b.rect=true; b.hh=b.hh??b.hw; b.r=Math.max(b.hw,b.hh); } // rect: hw/hh = meia-extensão (r vira raio de picking)
  b.r0=b.r; w.bodies.push(b); return b; } // r0 = raio base (a SDF é escalada a partir dele)
/* PRNG com seed (mulberry32) — Chacoalhar e cenários aleatórios ficam reprodutíveis */
let _seed=1; function srand(s){ _seed=s>>>0||1; }
function rng(){ _seed|=0; _seed=_seed+0x6D2B79F5|0; let t=Math.imul(_seed^_seed>>>15,1|_seed);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }
/* SDF de retângulo: distância do ponto à borda (negativa dentro) + direção de empurrão */
function rectSDF(px,py,b){ const dx=px-b.x, dy=py-b.y, qx=Math.abs(dx)-b.hw, qy=Math.abs(dy)-b.hh;
  const ox=Math.max(qx,0), oy=Math.max(qy,0), outer=Math.hypot(ox,oy), inner=Math.min(Math.max(qx,qy),0);
  let nx,ny; if(outer>1e-9){ nx=ox*Math.sign(dx)/outer; ny=oy*Math.sign(dy)/outer; }
  else if(qx>qy){ nx=Math.sign(dx)||1; ny=0; } else { nx=0; ny=Math.sign(dy)||1; }
  return {d:outer+inner, nx, ny}; }
function clearF(w){ for(const b of w.bodies){b.fx=0;b.fy=0; if(b._f)b._f.length=0;} }
const FKIND={central:'#ffe14d',attract:'#76ff03',repel:'#18ffff',chain:'#ff4081',mid:'#b388ff',seg:'#ffab40',fric:'#ff80ab',drag:'#b0bec5',bend:'#f78c6c'};
// acumula a força no corpo E (quando o debug "forças individuais" está ligado) grava cada parcela por origem
function addF(b,fx,fy,kind){ b.fx+=fx; b.fy+=fy; if(dbg.forcesEach){ (b._f||(b._f=[])).push({fx,fy,kind}); } }
function dist(a,b){ return Math.hypot(b.x-a.x,b.y-a.y); }
function KE(w){ let s=0; for(const b of w.bodies) if(!b.fixed) s+=0.5*(b.vx*b.vx+b.vy*b.vy); return s; }

function integrate(w,o){
  const dt=o.dt??1, damping=o.damping??0.85, order=o.order??'after', cap=o.cap??1e9;
  for(const b of w.bodies){
    if(b.fixed||b.im===0){ b.vx=0; b.vy=0; continue; }
    const ax=b.fx*b.im, ay=b.fy*b.im;
    if(order==='before'){ b.vx=b.vx*damping+ax*dt; b.vy=b.vy*damping+ay*dt; }
    else { b.vx=(b.vx+ax*dt)*damping; b.vy=(b.vy+ay*dt)*damping; }
    if(b.vx>cap)b.vx=cap; else if(b.vx<-cap)b.vx=-cap;
    if(b.vy>cap)b.vy=cap; else if(b.vy<-cap)b.vy=-cap;
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(!isFinite(b.x)||!isFinite(b.y)){ b.x=Math.max(-4000,Math.min(4000,b.x||0)); b.y=Math.max(-4000,Math.min(4000,b.y||0)); }
  }
}
/* layer gate — interseção SIMÉTRICA de tags, como o produto (src/physics/collision.js::layersIntersect).
   Sem camadas declaradas em NENHUM dos dois => colidem por padrão (conveniência didática do sandbox). */
function inter(a,b){ if(!a||!b)return false; for(const x of a) if(b.has(x)) return true; return false; }
function collide(a,b){
  if(!a.cl&&!b.cl) return true;
  return inter(a.cl,b.cl);
}
/* repulsão círculo-círculo por perfil; one-sided; PI opcional. Registra contatos p/ debug. */
function repel(w,o){
  const profile=o.profile??'linear', k=o.k??0.4, uniPad=(o.pad??0)+view.pad, n=o.n??2, K=o.K??1,
    ki=o.ki??0, fmax=o.fmax??80, accMax=o.accMax??400, zoneModel=o.zoneModel??'zone'; // DECISÃO: repulsão sempre zona×zona (soma os pads dos dois corpos)
  w.step++;
  const N=w.bodies.length;
  for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
    const a=w.bodies[i],b=w.bodies[j];
    if(!collide(a,b))continue;
    const dx=b.x-a.x,dy=b.y-a.y,D=Math.hypot(dx,dy)||1e-9;
    const padA=a.pad??uniPad, padB=b.pad??uniPad;            // zona por-elemento (cada corpo pode ter a sua)
    const extra=zoneModel==='zone'?(padA+padB):Math.max(padA,padB);
    const pk=i*100003+j;
    if(a.rect||b.rect){ // AABB×AABB: penetração por eixo, resolve no MENOR (espelha src/physics/collision.js)
      const ahw=a.rect?a.hw:a.r, ahh=a.rect?a.hh:a.r, bhw=b.rect?b.hw:b.r, bhh=b.rect?b.hh:b.r;
      const ox=(ahw+bhw+extra)-Math.abs(dx), oy=(ahh+bhh+extra)-Math.abs(dy);
      if(ox<=0||oy<=0){ w.acc.delete(pk); continue; }
      const pen=Math.min(ox,oy);
      let f=0; if(profile==='linear')f=k*pen; else if(profile==='constant')f=k;
      else { const R0=Math.min(ahw+bhw,ahh+bhh)+extra, u=Math.min(pen/R0,1); f=Math.min(K*k*R0*Math.pow(u,n),fmax); }
      if(ki>0){ let e=w.acc.get(pk)??0; e=Math.min(e+pen,accMax); w.acc.set(pk,e); f+=ki*e; }
      if(ox<oy){ const s=dx>=0?1:-1; addF(a,-f*s,0,'repel'); addF(b,f*s,0,'repel'); }
      else { const s=dy>=0?1:-1; addF(a,0,-f*s,'repel'); addF(b,0,f*s,'repel'); }
      continue; }
    const sumR=a.r+b.r, gap=D-sumR;
    let f=0, active=false;
    if(profile==='linear'){ const pen=(sumR+extra)-D; if(pen>0){ f=k*pen; active=true; } }
    else if(profile==='constant'){ if(gap<extra){ f=k; active=true; } }
    else if(profile==='power'){ const R0=sumR+extra; if(D<R0){ const u=(R0-D)/R0; f=Math.min(K*k*R0*Math.pow(u,n),fmax); active=true; } } // f = K·k·R0·uⁿ; K = ganho do perfil (compensa uⁿ<u em overlap pequeno); n=1,K=1 ≡ linear
    if(!active){ w.acc.delete(pk); continue; }
    if(ki>0){ const pen=Math.max((sumR+extra)-D,0); let e=w.acc.get(pk); if(e===undefined){e=0;} e=Math.min(e+pen,accMax); w.acc.set(pk,e); f+=ki*e; }
    const ux=dx/D,uy=dy/D;
    addF(a,-ux*f,-uy*f,'repel'); addF(b,ux*f,uy*f,'repel');
  }
}
function central(w,k,alpha){ const g=k*(alpha??1)*view.central; for(const b of w.bodies){ if(b.fixed)continue; addF(b,-g*b.x,-g*b.y,'central'); } }
function attractPoint(w,idxs,P,c){ for(const i of idxs){ const b=w.bodies[i]; addF(b,c*(P.x-b.x),c*(P.y-b.y),'attract'); } }
function attractLine(w,idxs,L,c){ // L: {x,y,ang} linha infinita; puxa perpendicular
  const nx=-Math.sin(L.ang), ny=Math.cos(L.ang);
  for(const i of idxs){ const b=w.bodies[i]; const d=(b.x-L.x)*nx+(b.y-L.y)*ny; addF(b,-c*d*nx,-c*d*ny,'attract'); }
}
function attractRegion(w,idxs,box,c){ for(const i of idxs){ const b=w.bodies[i];
  const cx=Math.max(box.x0,Math.min(box.x1,b.x)), cy=Math.max(box.y0,Math.min(box.y1,b.y));
  addF(b,c*(cx-b.x),c*(cy-b.y),'attract'); } }
function pairAttractAll(w,idxs,c,cut){ for(let m=0;m<idxs.length;m++)for(let n=m+1;n<idxs.length;n++){
  const a=w.bodies[idxs[m]],b=w.bodies[idxs[n]]; const dx=b.x-a.x,dy=b.y-a.y,D=Math.hypot(dx,dy)||1e-9;
  if(cut&&D>cut)continue; const ux=dx/D,uy=dy/D; addF(a,ux*c,uy*c,'attract'); addF(b,-ux*c,-uy*c,'attract'); } }
function chainSpring(w,chain,k,rest){ for(let m=0;m+1<chain.length;m++){
  const a=w.bodies[chain[m]],b=w.bodies[chain[m+1]]; const dx=b.x-a.x,dy=b.y-a.y,D=Math.hypot(dx,dy)||1e-9;
  const f=k*(D-rest), ux=dx/D,uy=dy/D; addF(a,ux*f,uy*f,'chain'); addF(b,-ux*f,-uy*f,'chain'); } }
function midline(w,chain,k){ const a=w.bodies[chain[0]], b=w.bodies[chain[chain.length-1]];
  for(let m=1;m<chain.length-1;m++){ const t=m/(chain.length-1); const mx=a.x+(b.x-a.x)*t, my=a.y+(b.y-a.y)*t;
    const c=w.bodies[chain[m]]; addF(c,k*(mx-c.x),k*(my-c.y),'mid'); } }
/* segmento (cápsula) vs corpos-obstáculo: repele os corners do segmento que penetra um nó */
function segVsBodies(w,chain,obstacles,k,thick){
  for(let m=0;m+1<chain.length;m++){
    const p=w.bodies[chain[m]], q=w.bodies[chain[m+1]];
    for(const o of obstacles){
      // ponto mais próximo do centro do obstáculo no segmento
      const vx=q.x-p.x, vy=q.y-p.y, L2=vx*vx+vy*vy||1e-9;
      let t=((o.x-p.x)*vx+(o.y-p.y)*vy)/L2; t=Math.max(0,Math.min(1,t));
      const cx=p.x+vx*t, cy=p.y+vy*t;
      let pen,ux,uy;
      if(o.rect){ const s=rectSDF(cx,cy,o); pen=(thick+view.pad)-s.d; ux=s.nx; uy=s.ny; }
      else { const dx=cx-o.x, dy=cy-o.y, D=Math.hypot(dx,dy)||1e-9; pen=(o.r+thick+view.pad)-D; ux=dx/D; uy=dy/D; }
      if(pen>0){ const f=k*pen;
        // distribui aos dois corners (peso por proximidade)
        addF(p,ux*f*(1-t),uy*f*(1-t),'seg'); addF(q,ux*f*t,uy*f*t,'seg');
      }
    }
  }
}
/* interseção exata de dois segmentos (contagem de cruzamentos nas métricas) */
function segsCross(p,q,r,s){ const d1x=q.x-p.x,d1y=q.y-p.y,d2x=s.x-r.x,d2y=s.y-r.y;
  const den=d1x*d2y-d1y*d2x; if(Math.abs(den)<1e-9)return false;
  const t=((r.x-p.x)*d2y-(r.y-p.y)*d2x)/den, u=((r.x-p.x)*d1y-(r.y-p.y)*d1x)/den;
  return t>0.001&&t<0.999&&u>0.001&&u<0.999; }
function countChainCrossings(w,chains){ let n=0;
  for(let a=0;a<chains.length;a++)for(let b=a+1;b<chains.length;b++)
    for(let m=0;m+1<chains[a].length;m++)for(let k=0;k+1<chains[b].length;k++)
      if(segsCross(w.bodies[chains[a][m]],w.bodies[chains[a][m+1]],w.bodies[chains[b][k]],w.bodies[chains[b][k+1]]))n++;
  return n; }
/* distância entre dois segmentos (anti-cruzamento de arestas).
   Exata para segmentos NÃO cruzados (o mínimo sempre envolve um endpoint);
   se cruzam, d=0 e `crossing` sinaliza para o cenário resolver perpendicular. */
function segDist(p,q,r,s){
  if(segsCross(p,q,r,s)){ return {d:0, crossing:true, pa:[p,[p.x,p.y]]}; }
  function clos(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay,L2=vx*vx+vy*vy||1e-9;
    let t=((px-ax)*vx+(py-ay)*vy)/L2;t=Math.max(0,Math.min(1,t));return [ax+vx*t,ay+vy*t];}
  const cands=[ [p, clos(p.x,p.y,r.x,r.y,s.x,s.y)], [q, clos(q.x,q.y,r.x,r.y,s.x,s.y)],
                [r, clos(r.x,r.y,p.x,p.y,q.x,q.y)], [s, clos(s.x,s.y,p.x,p.y,q.x,q.y)] ];
  let best=1e9,bp=null;
  for(const [P,c] of cands){ const d=Math.hypot(P.x-c[0],P.y-c[1]); if(d<best){best=d;bp=[P,c];} }
  return {d:best, pa:bp};
}
/* XPBD distância (1 iteração); projeção = alpha 0.
   Corrige posição E velocidade (Δv=Δx/dt) — sem isso a carga externa acumula
   velocidade que a projeção anula só em posição: KE fantasma, settle nunca dispara.
   `rev` inverte a ordem da varredura: Gauss-Seidel SIMÉTRICO (alternar fwd/rev por
   iteração) cancela o viés de ordem que, num anel, injeta deslocamento tangencial
   de quiralidade fixa → rotação uniforme que o damping não vence. Achado que vale
   para o engine real: solver sequencial precisa de varredura simétrica ou Jacobi. */
function xpbd(w,pairs,alpha,dt,rev){ const ac=alpha/(dt*dt);
  for(let k=0;k<pairs.length;k++){ const pr=pairs[rev?pairs.length-1-k:k];
    const a=w.bodies[pr[0]],b=w.bodies[pr[1]],L=pr[2];
    const dx=b.x-a.x,dy=b.y-a.y,D=Math.hypot(dx,dy)||1e-9,C=D-L,wsum=a.im+b.im+ac;
    if(wsum<=0)continue; const dl=-C/wsum, ux=dx/D,uy=dy/D;
    if(!a.fixed){a.x-=ux*dl*a.im;a.y-=uy*dl*a.im; a.vx-=ux*dl*a.im/dt; a.vy-=uy*dl*a.im/dt;}
    if(!b.fixed){b.x+=ux*dl*b.im;b.y+=uy*dl*b.im; b.vx+=ux*dl*b.im/dt; b.vy+=uy*dl*b.im/dt;} } }
/* XPBD não-overlap (desigualdade: só projeta quando penetra; alpha 0 = exato) */
function xpbdOverlap(w,alpha,dt,pad,rev){ const ac=alpha/(dt*dt); const N=w.bodies.length;
  const PR=[]; for(let i=0;i<N;i++)for(let j=i+1;j<N;j++) PR.push([i,j]);
  for(let k=0;k<PR.length;k++){ const [i,j]=PR[rev?PR.length-1-k:k];
    const a=w.bodies[i],b=w.bodies[j];
    if(!collide(a,b))continue;
    const dx=b.x-a.x,dy=b.y-a.y,D=Math.hypot(dx,dy)||1e-9,C=D-(a.r+b.r+(pad??0));
    if(C>=0)continue; const wsum=a.im+b.im+ac; if(wsum<=0)continue;
    const dl=-C/wsum, ux=dx/D,uy=dy/D;
    if(!a.fixed){a.x-=ux*dl*a.im;a.y-=uy*dl*a.im; a.vx-=ux*dl*a.im/dt; a.vy-=uy*dl*a.im/dt;}
    if(!b.fixed){b.x+=ux*dl*b.im;b.y+=uy*dl*b.im; b.vx+=ux*dl*b.im/dt; b.vy+=uy*dl*b.im/dt;} } }

/* ============================================================
   UTIL de cenário
   ============================================================ */
function ring(w,n,R,r,opts){ const N=Math.max(2, view.count||n); const out=[]; for(let i=0;i<N;i++){ const a=i/N*Math.PI*2;
  out.push(w.bodies.length); addBody(w,Object.assign({x:Math.cos(a)*R,y:Math.sin(a)*R,r},opts)); } return out; } // count global p/ cenários countable
function makeChain(w,A,Bp,n,r,opts){ const idx=[]; for(let i=0;i<=n;i++){ const t=i/n;
  idx.push(w.bodies.length); addBody(w,Object.assign({x:A.x+(Bp.x-A.x)*t,y:A.y+(Bp.y-A.y)*t,r,im:1},opts)); } return idx; }
const L=(...t)=>new Set(t);

  params:[param('mech','mecanismo','select',{options:[['soft','força mole (linear)'],['barrier','potência xⁿ + substep'],['pbd','projeção PBD']],def:'soft'}),
    param('pull','compressão central','range',{min:.02,max:.15,step:.005,def:.06}),param('sub','sub-steps','range',{min:1,max:24,step:1,def:8}),param('iters','iters PBD','range',{min:1,max:40,step:1,def:12})],
  defaultCount:6, init(w,p){ ring(w,6,70,18,{cl:L('g')}); },
  forces(w,p,c){ central(w,p.pull,1); if(p.mech==='soft') repel(w,{profile:'linear',k:.4,pad:4});
    else if(p.mech==='barrier') repel(w,{profile:'power',k:.4,pad:10,n:3,K:8}); },
  constraints(w,p,c){ if(p.mech!=='pbd')return; const N=w.bodies.length; const dt=c.dt??1;
    const PR=[]; for(let i=0;i<N;i++)for(let j=i+1;j<N;j++) PR.push([i,j]);
    for(let it=0;it<p.iters;it++){ const rev=it%2===1; // varredura simétrica anti-rotação
      for(let k=0;k<PR.length;k++){ const [i,j]=PR[rev?PR.length-1-k:k]; const a=w.bodies[i],b=w.bodies[j];
      const dx=b.x-a.x,dy=b.y-a.y,D=Math.hypot(dx,dy)||1e-9,pen=(a.r+b.r)-D; if(pen<=0)continue;
      const ux=dx/D,uy=dy/D,h=pen/2; a.x-=ux*h;a.y-=uy*h;b.x+=ux*h;b.y+=uy*h;
      a.vx-=ux*h/dt;a.vy-=uy*h/dt;b.vx+=ux*h/dt;b.vy+=uy*h/dt; } } }, // Δv=Δx/dt: projeção sem corrigir velocidade gera KE fantasma
  opts:p=>({dt:1,damping:.8,cap:60}), sub:p=>p.mech==='barrier'?p.sub:1,
  summary(w,p){ let mg=1e9,N=w.bodies.length; for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const d=dist(w.bodies[i],w.bodies[j]);if(d<mg)mg=d;}
    const ov=(2*w.bodies[0].r)-mg; return `mecanismo=${p.mech}, menor gap=${mg.toFixed(2)}, overlap=${Math.max(ov,0).toFixed(2)}px ${ov>0.5?'(tendência)':'(sem overlap)'}`; },
});

SCN.push({ id:'F1',group:'F · Atratores',title:'F1 · Atrator-ponto (cluster)',

SCN.push({ id:'F3',group:'F · Atratores',title:'F3 · Atrator-região (conter) + peer',
  desc:'Filhos (azul) atraídos para DENTRO da região (container); um peer (laranja) repelido pela BORDA da região (SDF do rect — simétrico à atração dos filhos). Os filhos atravessam a borda livremente (atração, não repulsão); o peer não entra. Resolve o caso "interno × externo" sem veto.',
  params:[param('c','atração p/ dentro','range',{min:.02,max:.3,step:.02,def:.1}),param('kp','repulsão peer','range',{min:.2,max:2,step:.1,def:.6}),
    param('margin','folga do peer','range',{min:0,max:40,step:1,def:10})],
  init(w,p){ w.attractors.push({type:'region',x0:-90,y0:-60,x1:90,y1:60});

    addBody(w,{x:0,y:0,r:24,color:'#ffcb6b',role:'peer'}); },
  forces(w,p,c){ const box=w.attractors[0]; const kids=w.bodies.map((b,i)=>b.role==='child'?i:-1).filter(i=>i>=0);
    attractRegion(w,kids,box,p.c);

SCN.push({ id:'F5',group:'F · Atratores',title:'F5 · Contenção: campo × geometria derivada',
  desc:'O confronto dos dois modelos de container. CAMPO: o container é uma região fixa; filhos são atraídos para dentro (abaixo do header), o peer é repelido pela borda (SDF) — arraste um filho para fora e solte: ele VOLTA. DERIVADA (modelo atual do produto): o rect do container é o bbox dos filhos + padding — arrastar um filho para fora ESTICA o container (sem contenção; a costura frágil do compile-world). A aresta filho→peer atravessa a parede livremente nos dois modos. Métrica: área do container.',
  params:[param('mode','modelo','select',{options:[['field','campo (região fixa)'],['derived','derivada (bbox dos filhos)']],def:'field'}),
    param('catt','atração p/ dentro','range',{min:.02,max:.3,step:.01,def:.08}),
    param('kp','repulsão do peer','range',{min:.2,max:2,step:.1,def:.8}),
    param('pad','padding','range',{min:8,max:48,step:2,def:24})],
  init(w,p){ w._hw=130; w._hh=85; w._hdr=22;
    for(let i=0;i<4;i++) addBody(w,{x:-60+i*40,y:(i%2?-20:25),hw:26,hh:16,cl:L('k'),color:'#6cf',role:'child'});
    w._peer=addBody(w,{x:230,y:-40,hw:30,hh:20,cl:L('k'),color:'#ffcb6b',role:'peer'});
    const ch=makeChain(w,w.bodies[0],w._peer,5,4,{color:'#9ece6a'});
    ch.forEach((bi,k)=>w.bodies[bi].cl=L('e'+k)); // tag única por corner → fora do repel global
    w.chains.push(ch); },
  forces(w,p,c){ const kids=w.bodies.filter(b=>b.role==='child'); const peer=w._peer;
    let R;
    if(p.mode==='field'){ R={x:0,y:0,hw:w._hw,hh:w._hh}; }
    else { let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const b of kids){ x0=Math.min(x0,b.x-b.hw);y0=Math.min(y0,b.y-b.hh);x1=Math.max(x1,b.x+b.hw);y1=Math.max(y1,b.y+b.hh); }
      R={x:(x0+x1)/2, y:(y0+y1)/2-w._hdr/2, hw:(x1-x0)/2+p.pad, hh:(y1-y0)/2+p.pad+w._hdr/2}; }
    w._R=R;
    if(p.mode==='field'){ const box={x0:R.x-R.hw+p.pad, y0:R.y-R.hh+w._hdr+p.pad, x1:R.x+R.hw-p.pad, y1:R.y+R.hh-p.pad};
      for(const b of kids){ const cx=Math.max(box.x0+b.hw,Math.min(box.x1-b.hw,b.x)), cy=Math.max(box.y0+b.hh,Math.min(box.y1-b.hh,b.y));
        addF(b,p.catt*(cx-b.x),p.catt*(cy-b.y),'attract'); } }
    else { for(const b of kids) addF(b,-0.01*b.x,-0.01*b.y,'central'); } // derivada: filhos só têm central+colisão
    // peer repelido pela BORDA do container (nos dois modos)
    const s=rectSDF(peer.x,peer.y,R); const pen=(Math.max(peer.hw,peer.hh)+8)-s.d;
    if(pen>0){ addF(peer,s.nx*p.kp*pen,s.ny*p.kp*pen,'repel'); }
    addF(peer,0.004*(220-peer.x),0.004*(0-peer.y),'central'); // âncora fraca do peer à direita
    repel(w,{profile:'linear',k:.5,pad:6});
    const ch=w.chains[0], e0=w.bodies[ch[0]], e1=w.bodies[ch[ch.length-1]], c0=kids[0];
    addF(e0,.3*(c0.x-e0.x),.3*(c0.y-e0.y),'attract'); addF(e1,.3*(peer.x-e1.x),.3*(peer.y-e1.y),'attract');
    chainSpring(w,ch,.25,dist(e0,e1)/(ch.length-1)); midline(w,ch,.08); },
  opts:p=>({dt:1,damping:.82,cap:40}), sub:p=>2,
  metric(w,p){ const R=w._R; return {name:'área/1000',value:R?(R.hw*2*R.hh*2/1000):0}; },
  summary(w,p){ const R=w._R||{x:0,y:0,hw:0,hh:0}; let out=0;
    for(const b of w.bodies) if(b.role==='child'){ const s=rectSDF(b.x,b.y,R); if(s.d>-Math.min(b.hw,b.hh)) out++; }
    return `modelo=${p.mode}, container=${(R.hw*2).toFixed(0)}×${(R.hh*2).toFixed(0)}px, filhos fora/na borda=${out}`; },
  draw(g,w,p){ const R=w._R; if(R){ g.strokeStyle='#5ccfe6'; g.setLineDash([4,4]);
    g.strokeRect(R.x-R.hw,R.y-R.hh,R.hw*2,R.hh*2); g.setLineDash([]);
    g.fillStyle='rgba(92,207,230,.12)'; g.fillRect(R.x-R.hw,R.y-R.hh,R.hw*2,w._hdr); }
    drawChain(g,w,w.chains[0]); },
});

/* ---- G: arestas por força ---- */
function edgeSetup(w){ w.handles.push({x:-180,y:-80}); w.handles.push({x:180,y:80});
  const A=w.handles[0],Bp=w.handles[1]; const chain=makeChain(w,A,Bp,6,5,{color:'#9ece6a',im:1});
  w.bodies[chain[0]].fixed=false; w.bodies[chain[chain.length-1]].fixed=false; w.chains.push(chain); return chain; }
SCN.push({ id:'G1',group:'G · Arestas por força',title:'G1 · Aresta roteando ao redor de obstáculos (rect)',
  desc:'Aresta = cadeia de corners. Endpoints atraídos às alças ◆, corners repelidos por nós-obstáculo RETANGULARES (forma real do produto, via SDF), mola de cadeia + midline mantêm a linha. Aumente o nº de obstáculos, arraste-os ou às alças e veja a aresta recontornar.',
  params:[param('nobs','nº obstáculos','range',{min:1,max:4,step:1,def:1}),
    param('krep','repulsão obstáculo','range',{min:.1,max:2,step:.1,def:.8}),param('kchain','mola cadeia','range',{min:.05,max:1,step:.05,def:.3}),param('kmid','midline','range',{min:0,max:.5,step:.02,def:.12}),param('sub','sub-steps','range',{min:1,max:20,step:1,def:6})],
  rebuildOn:['nobs'],
  init(w,p){ const chain=edgeSetup(w); w._obs=[];
    const spots=[[0,0],[-100,70],[100,-70],[0,-120]];
    for(let i=0;i<(p.nobs||1);i++){ const [x,y]=spots[i]; w._obs.push(addBody(w,{x,y,hw:48,hh:30,fixed:true,color:'#ffcb6b',role:'obstacle'})); } },
  forces(w,p,c){ const chain=w.chains[0]; const A=w.handles[0],Bp=w.handles[1];
    const e0=w.bodies[chain[0]],e1=w.bodies[chain[chain.length-1]];
    addF(e0,.2*(A.x-e0.x),.2*(A.y-e0.y),'attract'); addF(e1,.2*(Bp.x-e1.x),.2*(Bp.y-e1.y),'attract');
    chainSpring(w,chain,p.kchain, dist(w.bodies[chain[0]],w.bodies[chain[chain.length-1]])/(chain.length-1));
    midline(w,chain,p.kmid);
    segVsBodies(w,chain,w._obs,p.krep,6); },
  opts:p=>({dt:1,damping:.8,cap:40}), sub:p=>p.sub,
  draw(g,w){ for(const h of w.handles) drawHandle(g,h); drawChain(g,w,w.chains[0]); },
});
SCN.push({ id:'G2',group:'G · Arestas por força',title:'G2 · Arestas que não se cruzam (N arestas)',
  desc:'N arestas-cadeia que se repelem (segmento×segmento, distância exata; cruzamento REAL ganha força perpendicular dedicada — a repulsão por proximidade sozinha não descruza). HUD/sparkline mostram a CONTAGEM de cruzamentos, a métrica que importa. Arraste as alças para forçar cruzamentos.',
  params:[param('nedges','nº de arestas','range',{min:2,max:5,step:1,def:2}),
    param('kcross','anti-cruzamento','range',{min:.1,max:2,step:.1,def:.7}),param('kchain','mola cadeia','range',{min:.05,max:1,step:.05,def:.3}),param('sub','sub-steps','range',{min:1,max:20,step:1,def:6})],
  rebuildOn:['nedges'],
  init(w,p){ const n=p.nedges||2; const colors=['#9ece6a','#c792ea','#5ccfe6','#ffcb6b','#ff8fa3'];
    for(let e=0;e<n;e++){ const a=e/n*Math.PI*2, b=a+Math.PI*(1-0.18*(e%2?1:-1)); // pares quase-diametrais → tendem a cruzar no meio
      const h1={x:Math.cos(a)*200,y:Math.sin(a)*120}, h2={x:Math.cos(b)*200,y:Math.sin(b)*120};
      w.handles.push(h1,h2);
      w.chains.push(makeChain(w,h1,h2,5,5,{color:colors[e%5]})); } },
  forces(w,p,c){ const hs=w.handles, cs=w.chains;
    for(let e=0;e<cs.length;e++){ const ch=cs[e],A=hs[e*2],B=hs[e*2+1]; const e0=w.bodies[ch[0]],e1=w.bodies[ch[ch.length-1]];
      addF(e0,.25*(A.x-e0.x),.25*(A.y-e0.y),'attract'); addF(e1,.25*(B.x-e1.x),.25*(B.y-e1.y),'attract');
      chainSpring(w,ch,p.kchain,40); midline(w,ch,.1); }
    const margin=18;
    for(let ea=0;ea<cs.length;ea++)for(let eb=ea+1;eb<cs.length;eb++){
      const a=cs[ea],b=cs[eb];
      for(let m=0;m+1<a.length;m++)for(let n2=0;n2+1<b.length;n2++){
        const pA=w.bodies[a[m]],qA=w.bodies[a[m+1]],pB=w.bodies[b[n2]],qB=w.bodies[b[n2+1]];
        const r=segDist(pA,qA,pB,qB); if(r.d>=margin)continue;
        if(r.crossing){ // cruzados: empurra A pela normal de B (e vice-versa) — proximidade não resolve d=0
          const ex=qB.x-pB.x,ey=qB.y-pB.y,Lb=Math.hypot(ex,ey)||1e-9; let nx=-ey/Lb,ny=ex/Lb;
          const dot=((pA.x+qA.x)-(pB.x+qB.x))*nx/2+((pA.y+qA.y)-(pB.y+qB.y))*ny/2; if(dot<0){nx=-nx;ny=-ny;}
          const f=p.kcross*margin*.5;
          addF(pA,nx*f,ny*f,'repel'); addF(qA,nx*f,ny*f,'repel'); addF(pB,-nx*f,-ny*f,'repel'); addF(qB,-nx*f,-ny*f,'repel'); continue; }
        const [Pt,cl]=r.pa; const dx=Pt.x-cl[0],dy=Pt.y-cl[1],D=Math.hypot(dx,dy)||1e-9,f=p.kcross*(margin-r.d); const ux=dx/D,uy=dy/D;
        addF(Pt,ux*f,uy*f,'repel'); } } },
  opts:p=>({dt:1,damping:.8,cap:40}), sub:p=>p.sub,
  metric(w,p){ return {name:'cruzamentos',value:countChainCrossings(w,w.chains)}; },
  summary(w,p){ return `cruzamentos=${countChainCrossings(w,w.chains)}`; },
  draw(g,w){ for(const h of w.handles) drawHandle(g,h); for(const ch of w.chains) drawChain(g,w,ch); },
});
SCN.push({ id:'G3',group:'G · Arestas por força',title:'G3 · Topologia: subdivisão fixa × fissão/fusão dinâmica',
  desc:'FIXA (estilo Holten): nº de corners constante — poucos não contornam bem, muitos custam mais, mas a topologia é estável. DINÂMICA: segmentos longos fissionam no meio, curtos fundem — adapta a resolução ao contorno, mas é o mecanismo que no engine v1 explodiu em cascata de shelves. O sparkline de corners revela oscilação de topologia (split↔merge sem convergir). Arraste o obstáculo contra a aresta nos dois modos.',
  params:[param('mode','topologia','select',{options:[['fixed','fixa (n constante)'],['dyn','dinâmica (fissão/fusão)']],def:'fixed'}),
    param('n','corners (fixa)','range',{min:2,max:16,step:1,def:6}),
    param('lmax','fissão acima de (px)','range',{min:40,max:140,step:5,def:80}),
    param('krep','repulsão','range',{min:.1,max:2,step:.1,def:.8}),param('sub','sub-steps','range',{min:1,max:16,step:1,def:6})],
  init(w,p){ w.handles.push({x:-180,y:-70},{x:180,y:70}); const ch=makeChain(w,w.handles[0],w.handles[1],p.n,5,{color:'#9ece6a'}); w.chains.push(ch);
    w._ob=addBody(w,{x:0,y:0,r:40,fixed:true,color:'#ffcb6b',role:'obstacle'}); },
  forces(w,p,c){ const ch=w.chains[0],A=w.handles[0],B=w.handles[1]; const e0=w.bodies[ch[0]],e1=w.bodies[ch[ch.length-1]];
    addF(e0,.25*(A.x-e0.x),.25*(A.y-e0.y),'attract'); addF(e1,.25*(B.x-e1.x),.25*(B.y-e1.y),'attract');
    chainSpring(w,ch,.3,dist(w.bodies[ch[0]],w.bodies[ch[ch.length-1]])/(ch.length-1)); midline(w,ch,.1);
    segVsBodies(w,ch,[w._ob],p.krep,6); },
  topo(w,p,c){ if(p.mode!=='dyn')return; const ch=w.chains[0]; const pts=ch.map(i=>w.bodies[i]);
    const lmin=p.lmax/4; // histerese: filho de uma fissão (L/2) fica acima de lmin → sem flip-flop imediato
    let changed=false; const np=[pts[0]];
    for(let i=1;i<pts.length;i++){ const a=np[np.length-1], b=pts[i];
      const Ls=Math.hypot(b.x-a.x,b.y-a.y);
      if(Ls>p.lmax && pts.length<24){ np.push({x:(a.x+b.x)/2,y:(a.y+b.y)/2,vx:(a.vx+b.vx)/2,vy:(a.vy+b.vy)/2}); changed=true; }

/* anti-cruzamento cadeia×cadeia (mesma mecânica do G2, fatorada p/ os cenários I) */
function antiCross(w,chains,kcross,margin){
  for(let ea=0;ea<chains.length;ea++)for(let eb=ea+1;eb<chains.length;eb++){
    const a=chains[ea],b=chains[eb];
    for(let m=0;m+1<a.length;m++)for(let n2=0;n2+1<b.length;n2++){
      const pA=w.bodies[a[m]],qA=w.bodies[a[m+1]],pB=w.bodies[b[n2]],qB=w.bodies[b[n2+1]];
      const r=segDist(pA,qA,pB,qB); if(r.d>=margin)continue;
      if(r.crossing){ const ex=qB.x-pB.x,ey=qB.y-pB.y,Lb=Math.hypot(ex,ey)||1e-9; let nx=-ey/Lb,ny=ex/Lb;
        const dot=((pA.x+qA.x)-(pB.x+qB.x))*nx/2+((pA.y+qA.y)-(pB.y+qB.y))*ny/2; if(dot<0){nx=-nx;ny=-ny;}
        const f=kcross*margin*.5;
        addF(pA,nx*f,ny*f,'repel'); addF(qA,nx*f,ny*f,'repel'); addF(pB,-nx*f,-ny*f,'repel'); addF(qB,-nx*f,-ny*f,'repel'); continue; }
      const [Pt,cl]=r.pa; const dx=Pt.x-cl[0],dy=Pt.y-cl[1],D=Math.hypot(dx,dy)||1e-9,f=kcross*(margin-r.d);
      addF(Pt,dx/D*f,dy/D*f,'repel'); } } }

  else if(a.type==='line'){ const dx=Math.cos(a.ang)*1000,dy=Math.sin(a.ang)*1000; g.beginPath();g.moveTo(a.x-dx,a.y-dy);g.lineTo(a.x+dx,a.y+dy);g.stroke(); drawHandle(g,{x:a.x+Math.cos(a.ang)*80,y:a.y+Math.sin(a.ang)*80}); drawHandle(g,{x:a.x,y:a.y}); }
  else if(a.type==='region'){ g.strokeRect(a.x0,a.y0,a.x1-a.x0,a.y1-a.y0); }
  g.setLineDash([]); g.restore(); }
function drawHandle(g,h){ g.save(); g.fillStyle='#ffcb6b'; g.translate(h.x,h.y); g.rotate(Math.PI/4); g.fillRect(-5,-5,10,10); g.restore(); }
function drawChain(g,w,chain){ if(!chain.length)return; const col=w.bodies[chain[0]]?.color||'#9ece6a';
  g.save(); g.strokeStyle=col; g.lineWidth=2; g.beginPath();
  for(let i=0;i<chain.length;i++){ const b=w.bodies[chain[i]]; if(i===0)g.moveTo(b.x,b.y);else g.lineTo(b.x,b.y);} g.stroke();
  g.fillStyle=col; for(const i of chain){ const b=w.bodies[i]; g.beginPath();g.arc(b.x,b.y,3,0,7);g.fill(); } g.restore(); }
function drawChainCurve(g,w,chain){ g.save(); g.strokeStyle='#9ece6a'; g.lineWidth=2; const pts=chain.map(i=>w.bodies[i]);
  g.beginPath(); g.moveTo(pts[0].x,pts[0].y);
  for(let i=0;i<pts.length-1;i++){ const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    for(let t=0;t<1;t+=.2){ const t2=t*t,t3=t2*t;
      const x=0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3);
      const y=0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3);
      g.lineTo(x,y); } }
  g.lineTo(pts[pts.length-1].x,pts[pts.length-1].y); g.stroke();
  g.fillStyle='#5a7'; for(const b of pts){ g.beginPath();g.arc(b.x,b.y,3,0,7);g.fill(); } g.restore(); }

function onParam(key){ if(current.onParam) current.onParam(w,P,rebuild);
  if(current.rebuildOn && current.rebuildOn.includes(key)) rebuild();
  else resetInstr(); // parâmetro mudou → medição anterior (settle/ms/históricos) fica inválida
  updatePrompt(); }

/* loop */
function frame(){ requestAnimationFrame(frame); if(!current||!w) return;
  const o=current.opts?current.opts(P):{dt:1,damping:.85};
  const sub=current.sub?current.sub(P):1; const dt=(o.dt??1)/sub;
  if(!paused||stepOnceFlag){ stepOnceFlag=false;
    const t0=performance.now();
    for(const b of w.bodies){ b._pvx=b.vx; b._pvy=b.vy; } // p/ aceleração real (Δv/dt)
    for(let s=0;s<sub;s++){
      clearF(w);
      current.forces?.(w,P,{dt,alpha:w.alpha});
      applyDrag(w);
      integrate(w,Object.assign({},o,{dt}));
      current.constraints?.(w,P,{dt});
    }
    current.topo?.(w,P,{});
    // resultante exibida = aceleração REAL do tick (inclui damping/cap/constraints),
    // não a soma das forças dos contributors — senão a seta "segue a velocidade"
    // quando o freio dominante é o damping do integrador
    { const dtT=o.dt??1; for(const b of w.bodies){ b._ax=(b.vx-(b._pvx??b.vx))/dtT; b._ay=(b.vy-(b._pvy??b.vy))/dtT; } }
    msTick=msTick*0.9+(performance.now()-t0)*0.1; // EMA do custo físico por tick
    tickCount++;
    const ke=KE(w);
    // assentamento: KE POR CORPO MÓVEL abaixo do limiar por 30 ticks seguidos (limiar absoluto
    // não escala p/ cenas grandes). 1e-3/corpo ⇒ |v|≲0.045px/tick: sub-pixel, parado na prática.
    let movable=0; for(const b of w.bodies) if(!b.fixed) movable++;
    if(settleTicks==null){ if(ke/Math.max(1,movable)<1e-3&&!dragTarget){ settleRun++; if(settleRun>=30) settleTicks=tickCount-30; } else settleRun=0; }
    HIST.ke.push(ke); if(HIST.ke.length>240)HIST.ke.shift();
    if(current.metric){ const m=current.metric(w,P); HIST.metricName=m.name;
      HIST.metric.push(m.value); if(HIST.metric.length>240)HIST.metric.shift(); }
  }
  render(o,sub);
}
function applyDrag(w){ if(!dragTarget)return; const t=dragTarget;
  if(t.body){ // drag cinemático: o corpo segue o cursor (fixado), sem mola rígida → sem flicker/explosão. Vizinhos ainda são empurrados por colisão.
    t.body.x=mouse.x; t.body.y=mouse.y; t.body.vx=0; t.body.vy=0; }
  else if(t.handle){ t.handle.x=mouse.x; t.handle.y=mouse.y; }
  else if(t.attr){ if(t.attr.type==='region'){ const dx=mouse.x-(t.attr.x0+t.attr.x1)/2, dy=mouse.y-(t.attr.y0+t.attr.y1)/2; t.attr.x0+=dx;t.attr.x1+=dx;t.attr.y0+=dy;t.attr.y1+=dy; } else { t.attr.x=mouse.x;t.attr.y=mouse.y; } }
}
function render(o,sub){ g.clearRect(0,0,W,H); g.save(); g.translate(W/2,H/2); g.scale(view.zoom,view.zoom);
  // grid (cobre a área de mundo visível conforme o zoom)
  const hw=(W/2)/view.zoom, hh=(H/2)/view.zoom;
  g.strokeStyle='rgba(255,255,255,.03)'; g.lineWidth=1/view.zoom;
  for(let x=-Math.ceil(hw/40)*40;x<hw;x+=40){g.beginPath();g.moveTo(x,-hh);g.lineTo(x,hh);g.stroke();}
  for(let y=-Math.ceil(hh/40)*40;y<hh;y+=40){g.beginPath();g.moveTo(-hw,y);g.lineTo(hw,y);g.stroke();}
  // scenario extras (attractors, chains)
  current.draw?.(g,w,P,dbg);
  // zona de força externa (colisor soft): usa o pad do cenário se houver, senão o pad global
  const padParam=current.params.find(p=>p.key==='pad'||p.key==='gap');
  const zonePad=padParam?(P[padParam.key]||0):view.pad;
  // bodies
  for(const b of w.bodies){
    if(b.rect){ const zp=(b.pad??zonePad); // corpo retangular (forma do produto)
      if(dbg.sdf&&zp>0&&!b.fixed){ g.fillStyle='rgba(92,207,230,.10)'; g.fillRect(b.x-b.hw-zp,b.y-b.hh-zp,(b.hw+zp)*2,(b.hh+zp)*2);
        g.strokeStyle='rgba(92,207,230,.40)'; g.setLineDash([3,3]); g.strokeRect(b.x-b.hw-zp,b.y-b.hh-zp,(b.hw+zp)*2,(b.hh+zp)*2); g.setLineDash([]); }
      g.fillStyle=dbg.layers&&b.cl?layerColor(b):b.color; g.globalAlpha=b.fixed?.55:.9;
      g.fillRect(b.x-b.hw,b.y-b.hh,b.hw*2,b.hh*2); g.globalAlpha=1;
      g.strokeStyle=b.fixed?'#888':'rgba(0,0,0,.35)'; g.strokeRect(b.x-b.hw,b.y-b.hh,b.hw*2,b.hh*2); continue; }
    if(b.role==='target'||b.role==='obstacle'||b.r>30){ g.fillStyle=b.color; g.globalAlpha=.5; g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill(); g.globalAlpha=1; g.strokeStyle=b.color;g.stroke(); continue; }
    if(dbg.sdf){ const zr=b.r+(b.pad??zonePad); // ÁREA da zona de força (controlada pelo toggle "zona de força"); por-elemento se b.pad existir
      g.fillStyle='rgba(92,207,230,.10)'; g.beginPath();g.arc(b.x,b.y,zr,0,7);g.fill();
      g.strokeStyle='rgba(92,207,230,.40)'; g.setLineDash([3,3]); g.beginPath();g.arc(b.x,b.y,zr,0,7);g.stroke(); g.setLineDash([]); }
    g.beginPath();g.arc(b.x,b.y,b.r,0,7); g.fillStyle=dbg.layers&&b.cl?layerColor(b):b.color; g.globalAlpha=b.fixed?.6:.9; g.fill(); g.globalAlpha=1;
    if(b.fixed){ g.strokeStyle='#888'; g.stroke(); } }
  // forças INDIVIDUAIS: raio do centro até a borda; ESPESSURA ∝ intensidade; direção = direção da força; zero → some.
  // A ponta recua lw/2 para que o cap arredondado termine EXATAMENTE na borda e nunca vaze do nó;
  // espessura limitada a ~0,5·r para não ficar bulboso quando a força é grande.
  if(dbg.forcesEach){ g.lineCap='round';
    const drawRay=(b,ux,uy,m,col)=>{ if(m<1e-4)return; const lw=Math.min(m*3,b.r*0.5); g.lineWidth=lw; g.strokeStyle=col;
      const re=Math.max(b.r-lw/2, lw/2+1); // recua a ponta; o cap (raio lw/2) tangencia a borda por dentro
      g.beginPath(); g.moveTo(b.x,b.y); g.lineTo(b.x+ux*re,b.y+uy*re); g.stroke(); };
    for(const b of w.bodies){ if(b.fixed)continue;
      if(b._f) for(const f of b._f){ const m=Math.hypot(f.fx,f.fy); if(m<1e-4)continue; drawRay(b,f.fx/m,f.fy/m,m,FKIND[f.kind]||'#fff'); }
      // arrasto viscoso do integrador (damping): a força de frenagem que não está em b._f — sempre -v
      const sp=Math.hypot(b.vx,b.vy), dv=sp*(1-(o.damping??.85))/(o.dt??1);
      if(dv>1e-3) drawRay(b,-b.vx/sp,-b.vy/sp,dv,FKIND.drag); }
    g.lineCap='butt'; }
  // RESULTANTE: aceleração real do tick (Δv/dt — inclui damping; aponta contra a velocidade ao frear).
  // Filtro "fade por módulo": SEM piso de comprimento — perto do equilíbrio a direção de um vetor
  // quase-nulo é indefinida, então a seta ENCOLHE e some (comprimento E opacidade ∝ módulo) em vez
  // de tremular em tamanho cheio em direções aleatórias. Deadband descarta o sub-pixel.
  if(dbg.forces){ g.lineWidth=2.5/view.zoom; g.strokeStyle='#ffffff'; for(const b of w.bodies){ if(b.fixed)continue;
    const fx=b._ax??b.fx, fy=b._ay??b.fy;
    const m=Math.hypot(fx,fy); if(m<0.05)continue; const ux=fx/m,uy=fy/m; const x0=b.x+ux*b.r,y0=b.y+uy*b.r;
    const len=Math.min(m*8,150); g.globalAlpha=Math.max(.12,Math.min(m/1.5,1));
    arrow(g,x0,y0,x0+ux*len,y0+uy*len); } g.globalAlpha=1; g.lineWidth=1; }
  g.restore();
  // sparklines (coordenadas de tela): KE sempre; métrica do cenário quando declarada. Toggle "gráficos".
  if(show.spark){ drawSpark(W-258,10,248,42,HIST.ke,'#5ccfe6','KE');
    if(HIST.metric.length)drawSpark(W-258,60,248,42,HIST.metric,'#ffcb6b',HIST.metricName); }
  // HUD
  const ke=KE(w); const extra=current.summary?'\n'+current.summary(w,P):'';
  let nmov=0; for(const b of w.bodies) if(!b.fixed) nmov++;
  hud.textContent=`corpos: ${w.bodies.length}   sub-steps: ${sub}   ms/tick: ${msTick.toFixed(2)}${paused?'   ⏸ pausado':''}\n`+
    `KE: ${ke.toFixed(4)} ${ke/Math.max(1,nmov)>8?'⚠ instável':''}   ${settleTicks!=null?`assentou em ${settleTicks} ticks`:`tick ${tickCount} (não assentado)`}`+extra;
}
/* sparkline minimalista no canto do stage (escala automática pelo máximo da janela) */
function drawSpark(x,y,wd,ht,data,color,label){ if(data.length<2)return;
  g.fillStyle='rgba(0,0,0,.35)'; g.fillRect(x,y,wd,ht);
  g.strokeStyle='rgba(255,255,255,.15)'; g.strokeRect(x,y,wd,ht);
  let mx=1e-9; for(const v of data) if(v>mx)mx=v;
  g.strokeStyle=color; g.lineWidth=1; g.beginPath();
  for(let i=0;i<data.length;i++){ const px=x+i/(data.length-1)*wd, py=y+ht-2-(data[i]/mx)*(ht-4);
    if(i===0)g.moveTo(px,py); else g.lineTo(px,py); } g.stroke();
  g.fillStyle='rgba(214,222,235,.8)'; g.font='10px monospace';
  g.fillText(`${label}  máx ${mx<10?mx.toFixed(2):mx.toFixed(0)}  atual ${data[data.length-1]<10?data[data.length-1].toFixed(2):data[data.length-1].toFixed(0)}`,x+5,y+11); }
function arrow(g,x0,y0,x1,y1){ const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy); if(L<2)return; g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();
  const a=Math.atan2(dy,dx); g.beginPath();g.moveTo(x1,y1);g.lineTo(x1-6*Math.cos(a-.4),y1-6*Math.sin(a-.4));g.moveTo(x1,y1);g.lineTo(x1-6*Math.cos(a+.4),y1-6*Math.sin(a+.4));g.stroke(); }
const LCOL={}; function layerColor(b){ const key=[...(b.cl||[])].join(); if(!LCOL[key]){ const h=(Object.keys(LCOL).length*67)%360; LCOL[key]=`hsl(${h},65%,60%)`; } return LCOL[key]; }

/* mouse */
function toWorld(ev){ const r=cv.getBoundingClientRect(); return {x:(ev.clientX-r.left-W/2)/view.zoom, y:(ev.clientY-r.top-H/2)/view.zoom}; }
cv.addEventListener('mousedown',ev=>{ const m=toWorld(ev); mouse.x=m.x;mouse.y=m.y;mouse.down=true; dragTarget=pick(m);
  if(dragTarget){ settleTicks=null; settleRun=0; } // perturbação → re-mede o assentamento
  if(dragTarget&&dragTarget.body){ dragTarget.wasFixed=dragTarget.body.fixed; dragTarget.body.fixed=true; } }); // fixa enquanto arrasta
window.addEventListener('mousemove',ev=>{ const m=toWorld(ev); mouse.x=m.x;mouse.y=m.y; });
window.addEventListener('mouseup',()=>{ mouse.down=false;
  if(dragTarget&&dragTarget.body){ dragTarget.body.fixed=dragTarget.wasFixed; dragTarget.body.vx=0; dragTarget.body.vy=0; } // solta sem velocidade → assenta liso
  dragTarget=null; });
cv.addEventListener('wheel',ev=>{ ev.preventDefault(); // roda do mouse = zoom (sincroniza o slider)
  view.zoom=Math.max(0.3,Math.min(3, view.zoom*(ev.deltaY<0?1.1:1/1.1)));
  if(zoomCtl){ zoomCtl.inp.value=view.zoom; zoomCtl.val.textContent=view.zoom.toFixed(2); } },{passive:false});
function pick(m){ // alças primeiro, depois atratores, depois corpos
  for(const h of w.handles){ if(Math.hypot(h.x-m.x,h.y-m.y)<14) return {handle:h}; }
  for(const a of w.attractors){ if(a.type==='point'||a.type==='line'){ if(Math.hypot(a.x-m.x,a.y-m.y)<16) return {attr:a}; } else if(a.type==='region'){ const cx=(a.x0+a.x1)/2,cy=(a.y0+a.y1)/2; if(Math.hypot(cx-m.x,cy-m.y)<30) return {attr:a}; } }
  let best=null,bd=1e9; for(const b of w.bodies){ const d=Math.hypot(b.x-m.x,b.y-m.y); if(d<b.r+6&&d<bd){bd=d;best=b;} }
  return best?{body:best}:null;
}

/* prompt output (resumo p/ realimentar a discussão) */
function updatePrompt(){ if(!current)return; const parts=[];
  for(const pr of current.params){ const v=P[pr.key]; if(v!==pr.def) parts.push(`${pr.label}=${v}`); }
  const note=NOTES[current.id];
  const verdict=(note&&note.verdict)||'aberto';
  const met=[`ms/tick=${msTick.toFixed(2)}`,
    settleTicks!=null?`assentou em ${settleTicks} ticks`:`não assentado (tick ${tickCount})`,
    `seed=${view.seed}`];
  if(HIST.metric.length) met.push(`${HIST.metricName}=${HIST.metric[HIST.metric.length-1].toFixed(2)}`);
  const txt=`Cenário ${current.id} — ${current.title} [status: ${META[current.id]||'aberto'}; veredito: ${verdict}]\n`+
    (parts.length?`Parâmetros não-default: ${parts.join(', ')}\n`:`(parâmetros default)\n`)+
    `Métricas: ${met.join(', ')}\n`+
    `Observação: ${current.summary?current.summary(w,P):'(descreva o que observou: estável? overlap? como assentou?)'}`+
    (note&&note.notes?`\nNotas: ${note.notes}`:'');
  document.getElementById('prompt').textContent=txt; }
document.getElementById('copy').onclick=()=>{ navigator.clipboard.writeText(document.getElementById('prompt').textContent);
  const b=document.getElementById('copy'); const t=b.textContent; b.textContent='Copiado!'; setTimeout(()=>b.textContent=t,1200); };

/* boot */
// splitter: arrasta para redimensionar o painel de controles (e ver melhor a simulação)
(function(){ const sp=document.getElementById('splitter'), ctl=document.getElementById('controls');
  sp.addEventListener('mousedown',e=>{ e.preventDefault(); const sy=e.clientY, sh=ctl.offsetHeight;
    function mv(ev){ ctl.style.height=Math.max(70,Math.min(window.innerHeight-160, sh-(ev.clientY-sy)))+'px'; }
    function up(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); }
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up); }); })();
resize(); applyLayout(); buildMenu(); load('A1'); frame();
setInterval(()=>{ if(current) updatePrompt(); },800); // métricas vivas no prompt mesmo sem summary
</script>
